services:
  backend:
    build: ./backend-node
    container_name: parcel-backend
    ports:
      - "5000:5000"
    volumes:
      - parcel_data:/app/data
    restart: always

  frontend:
    build: ./frontend
    container_name: parcel-frontend
    ports:
      - "3000:3000"
    restart: always

volumes:
  parcel_data: